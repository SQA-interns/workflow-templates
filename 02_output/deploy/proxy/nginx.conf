# TLS reverse proxy for staging and production (SB-04, SR-09, ADR-11, D-97). Runs as the nginx user (SB-11).
# Certificate and key are mounted from TLS_DIR (fullchain.pem, privkey.pem); the operator renews them.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  # SB-07, SR-08 (F-38): the frontend container writes the redacted access log; this proxy writes none.
  access_log off;
  error_log /dev/stderr warn;
  # Not stricter than the frontend and backend, which answer oversized bodies themselves.
  client_max_body_size 4m;

  server {
    listen 8080;
    location / { return 308 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      proxy_pass http://frontend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
