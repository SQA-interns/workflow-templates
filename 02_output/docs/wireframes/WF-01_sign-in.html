<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WF-01 Sign in</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<header class="header"><div class="header-inner"><span class="logo">Contacts</span></div></header>
<main class="main">
<p class="annot">WF-01 · Sign in</p>

<div class="narrow"><div class="card stack">
<h1>Sign in</h1>
<h2>Sign in with e-mail</h2>
<div class="field"><label class="req">E-mail</label><div class="input"></div></div>
<div class="field"><label class="req">Password</label><div class="input"></div></div>
<span class="error" role="alert">Wrong e-mail or password.</span>
<button class="btn primary">Sign in</button>
<div class="divider"></div>
<button class="btn "><span class="icon" aria-hidden="true"></span>Sign in with Google</button>
<p class="muted">No account yet? <a href="#">Create an account</a></p>
</div></div>

</main>
<footer class="footer"><div class="footer-inner">Contacts</div></footer>
</body>
</html>
